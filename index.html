<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mario Floor is Lava! - Teacher Wynn</title>
    <!-- FREDOKA FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --mario-red: #e52521;
            --mario-blue: #00247d;
            --mario-yellow: #fbd000;
            --mario-green: #43b047;
            --mario-dark: #1e293b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Fredoka', cursive, sans-serif !important;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 16:9 CONTAINER */
        #game-app {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            background-color: #1e293b;
            border: 6px solid var(--mario-yellow);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 18px;
        }

        /* FULLSCREEN BUTTON */
        .btn-fullscreen {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: #ffffff;
            border: 3px solid var(--mario-yellow);
            border-radius: 50%;
            width: 46px;
            height: 46px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.15s ease;
        }
        .btn-fullscreen:hover { transform: scale(1.1); }

        /* MAIN MENU COVER OVERLAY */
        #main-menu-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 25px;
        }

        /* PILL-SHAPED BOTTOM ACTION BAR */
        .pill-dock {
            display: flex;
            flex-direction: row;
            gap: 12px;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 60px;
            border: 4px solid var(--mario-yellow);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 96%;
            overflow-x: auto;
            justify-content: center;
        }

        .pill-btn {
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffffff;
            padding: 12px 26px;
            border-radius: 40px;
            border: 3px solid #ffffff;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 6px 0 rgba(0,0,0,0.3);
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pill-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.3);
        }

        .pill-spelling { background: linear-gradient(135deg, var(--mario-red), #b91c1c); }
        .pill-sentence { background: linear-gradient(135deg, #0284c7, var(--mario-blue)); }
        .pill-edit-words { background: linear-gradient(135deg, var(--mario-green), #15803d); }
        .pill-edit-sentences { background: linear-gradient(135deg, #a855f7, #7e22ce); }

        /* TOP INTERFACE BAR */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 12%;
            z-index: 30;
            border-bottom: 4px solid var(--mario-yellow);
            padding-bottom: 8px;
            gap: 15px;
        }

        .btn-ui {
            font-size: 1.25rem;
            font-weight: 800;
            padding: 8px 22px;
            border-radius: 30px;
            border: 3px solid #ffffff;
            cursor: pointer;
            color: white;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
        }
        .btn-ui:active { transform: translateY(3px); }
        .btn-dark { background-color: var(--mario-dark); }
        .btn-next { background-color: var(--mario-green); }

        #status-message {
            font-size: 2.2rem;
            color: var(--mario-yellow);
            font-weight: 900;
            text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
            flex-grow: 1;
            text-align: center;
        }

        .hearts-box {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* SPELLING TARGET SLOTS TRAY */
        .slots-outer-container {
            height: 18%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
        }

        .slots-container {
            display: flex;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.4s ease;
            background: rgba(254, 240, 138, 0.2);
            padding: 8px 20px;
            border-radius: 20px;
            border: 3px dashed var(--mario-yellow);
            max-width: 98%;
            overflow-x: auto;
        }

        .slot {
            min-width: 50px;
            height: 65px;
            border-bottom: 6px solid #ffffff;
            font-size: 3.2rem;
            font-weight: 900;
            text-align: center;
            line-height: 60px;
            color: var(--mario-yellow);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            padding: 0 6px;
        }

        .slot.sentence-slot {
            font-size: 2.2rem;
            min-width: 140px;
            height: 70px;
            line-height: 65px;
            border-bottom-width: 8px;
            padding: 0 12px;
        }

        .slot.active-target {
            border-bottom-color: var(--mario-red);
            background-color: rgba(229, 37, 33, 0.3);
            border-radius: 8px 8px 0 0;
        }

        /* LAVA PLAY ZONE */
        .lava-zone {
            flex-grow: 1;
            position: relative;
            background: linear-gradient(180deg, #451a03 0%, #7c2d12 30%, #c2410c 60%, #ea580c 100%);
            border-radius: 20px;
            border: 5px solid var(--mario-yellow);
            margin-top: 6px;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }

        .lava-waves {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #fdba74 10%, #f97316 40%, #dc2626 80%);
            background-size: 80px 80px;
            animation: lavaBoil 2s infinite linear alternate;
            opacity: 0.85;
        }

        @keyframes lavaBoil {
            0% { transform: translateY(0) scaleY(1); }
            100% { transform: translateY(-12px) scaleY(1.05); }
        }

        /* FULL-SCREEN LAVA SWEEP OVERLAY */
        .dedicated-lava-overlay {
            position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent 0%, rgba(239, 68, 68, 0.85) 30%, rgba(249, 115, 22, 0.95) 70%, transparent 100%);
            z-index: 45; pointer-events: none; opacity: 0;
            transition: left 2.2s linear, opacity 0.3s ease;
        }
        .dedicated-lava-overlay.sweeping { left: 100%; opacity: 1; }

        /* BRICK PLATFORMS */
        .brick-platform {
            position: absolute; bottom: 0px;
            background-size: cover; background-repeat: no-repeat;
            z-index: 20; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4));
        }
        .brick-left { left: 0px; width: 180px; height: 110px; background-image: url('brick.png'); }
        .brick-right-peach { right: 0px; width: 240px; height: 150px; background-image: url('brick_peach.png'); z-index: 22; }
        .brick-right-mario { right: 240px; width: 180px; height: 110px; background-image: url('brick.png'); z-index: 20; }

        /* CASTLE ELEMENT SITTING DIRECTLY ON PEACH BRICK PLATFORM */
        .castle-element {
            position: absolute;
            bottom: 200px;
            right: 0px;
            width: 240px;
            height: 200px;
            background-image: url('castle.gif');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: bottom center;
            z-index: 23;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5));
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .castle-element.visible { opacity: 1; }

        /* BOWSER RUNNER */
        #bowser-runner {
            position: absolute; width: 180px; height: 180px;
            z-index: 50; pointer-events: none;
            left: 0; top: 0;
            will-change: transform;
            transform: translate3d(-300px, 0, 0);
        }
        #bowser-runner img { width: 100%; height: 100%; object-fit: contain; }
        #bowser-runner.walking img { animation: bowserWalk 0.4s infinite alternate ease-in-out; }

        @keyframes bowserWalk {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        /* MARIO CHARACTER POSITIONER */
        #mario-jumper-positioner {
            position: absolute; width: 120px; height: 120px;
            z-index: 55; pointer-events: none;
            top: 0; left: 0;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .mario-character {
            width: 100%; height: 100%;
            background-image: url('mariojump.gif') !important;
            background-size: contain; background-repeat: no-repeat;
            background-position: center bottom;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5));
        }

        #mario-jumper-positioner.jumping .mario-character {
            animation: marioArcHop 0.5s ease-in-out;
        }

        @keyframes marioArcHop {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-50px) scale(1.15); }
            100% { transform: translateY(0) scale(1); }
        }

        /* ROCK STEPPING STONES & MASSIVE TYPOGRAPHY */
        .stone-node {
            position: absolute; width: 150px; height: 150px;
            background-image: url('rock.png');
            background-size: contain; background-repeat: no-repeat;
            background-position: center;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 25;
            transition: transform 0.2s ease, filter 0.2s ease, opacity 0.4s ease;
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
            will-change: transform;
            padding: 10px;
        }

        .stone-node.sentence-rock {
            width: auto;
            min-width: 260px;
            height: 150px;
            background-size: 100% 100%;
            padding: 0 35px;
        }

        .stone-node.smooth-move {
            transition: transform 0.85s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .stone-node:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 10px 18px rgba(251, 208, 0, 0.8));
        }

        .stone-node.wrong-shake {
            animation: stoneShake 0.3s ease-in-out;
        }

        .stone-node.fade-out {
            opacity: 0 !important;
            pointer-events: none;
        }

        @keyframes stoneShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* GIANT SUPER-SIZED ROCK LABELS */
        .stone-label {
            font-size: 4.8rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 
                -3px -3px 0 #000,  
                 3px -3px 0 #000,
                -3px  3px 0 #000,
                 3px  3px 0 #000,
                 0px 4px 10px rgba(0,0,0,0.9);
            pointer-events: none;
            line-height: 1;
        }

        .sentence-rock .stone-label {
            font-size: 2.3rem;
            white-space: nowrap;
        }

        /* MODAL WINDOWS (DECK EDITORS) */
        .modal-drawer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(8px);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-drawer.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 30px;
            border: 6px solid var(--mario-yellow);
            width: 520px;
            max-width: 90%;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }

        .modal-title {
            margin: 0;
            font-size: 2rem;
            font-weight: 900;
            color: var(--mario-blue);
            text-align: center;
        }

        .modal-textarea {
            width: 100%;
            height: 180px;
            border: 3px solid #cbd5e1;
            border-radius: 16px;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            outline: none;
            resize: none;
        }

        .modal-textarea:focus { border-color: var(--mario-blue); }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* VICTORY OVERLAY WITH FLASHING WORD & ICON BUTTONS */
        .victory-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(8px);
            z-index: 250;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 20px;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .victory-overlay.active {
            opacity: 1; pointer-events: auto;
        }

        .victory-card-box {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            border: 6px solid var(--mario-yellow);
            border-radius: 35px;
            padding: 30px 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .victory-overlay.active .victory-card-box {
            transform: scale(1);
        }

        .flashing-victory-text {
            font-size: 4rem;
            font-weight: 900;
            color: var(--mario-yellow);
            text-align: center;
            text-shadow: 
                -3px -3px 0 #000,  
                 3px -3px 0 #000,
                -3px  3px 0 #000,
                 3px  3px 0 #000,
                 0 0 25px rgba(251, 208, 0, 0.8);
            animation: textFlash 0.8s infinite alternate ease-in-out;
            max-width: 800px;
            word-wrap: break-word;
            margin-bottom: 25px;
        }

        @keyframes textFlash {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.85; transform: scale(1.03); }
        }

        /* BIG ICON-ONLY ACTION BUTTONS */
        .icon-actions-row {
            display: flex;
            gap: 25px;
            align-items: center;
            justify-content: center;
        }

        .icon-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 5px solid #ffffff;
            font-size: 2.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 0 rgba(0,0,0,0.4);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            color: white;
        }

        .icon-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.4);
        }

        .icon-btn.next { background: linear-gradient(135deg, var(--mario-green), #15803d); }
        .icon-btn.retry { background: linear-gradient(135deg, var(--mario-yellow), #d97706); }

        /* GAME OVER MODAL */
        .game-over-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.92); z-index: 260;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 20px;
        }

        .game-over-title { font-size: 4rem; font-weight: 900; color: var(--mario-red); text-shadow: 3px 3px 0 #000; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- AUDIO ELEMENTS -->
    <audio id="sndMamamia" src="mamamia.mp3" preload="auto"></audio>
    <audio id="sndMariowin" src="mariowin.mp3" preload="auto"></audio>
    <audio id="sndArcadewin" src="arcadewin.mp3" preload="auto"></audio>
    <audio id="sndArcadelose" src="arcadelose.mp3" preload="auto"></audio>
    <audio id="sndBowser" src="bowser.mp3" preload="auto"></audio>

    <div id="game-app">
        <button class="btn-fullscreen" onclick="toggleFullscreen()" title="Toggle Fullscreen">⛶</button>

        <!-- MAIN MENU COVER OVERLAY -->
        <div id="main-menu-overlay">
            <div class="pill-dock">
                <div class="pill-btn pill-spelling" onclick="launchGameDirect('spelling')">🔤 Spelling Mode</div>
                <div class="pill-btn pill-sentence" onclick="launchGameDirect('sentence')">💬 Sentence Arrange</div>
                <div class="pill-btn pill-edit-words" onclick="openDeckEditor('spelling')">⚙️ Edit Words</div>
                <div class="pill-btn pill-edit-sentences" onclick="openDeckEditor('sentence')">⚙️ Edit Sentences</div>
            </div>
        </div>

        <!-- TOP BAR -->
        <div class="top-bar">
            <button class="btn-ui btn-dark" onclick="exitToMainMenu()">🏠 Menu</button>
            <div class="hearts-box" id="heartsDisplay">❤️❤️❤️</div>
            <div id="status-message">Floor is Lava! 🌋</div>
            <button class="btn-ui btn-next" onclick="nextLavaQuestion()">Next ➡️</button>
        </div>

        <!-- SPELLING TARGET SLOTS TRAY -->
        <div class="slots-outer-container">
            <div class="slots-container" id="slotsBox"></div>
        </div>

        <!-- LAVA PLAY ZONE -->
        <div class="lava-zone" id="lavaZone">
            <div class="lava-waves"></div>
            <div id="dedicatedLavaOverlay" class="dedicated-lava-overlay"></div>

            <!-- CASTLE (On top of brick_peach.png) -->
            <div id="castleElement" class="castle-element"></div>

            <!-- BRICK PLATFORMS -->
            <div class="brick-platform brick-left"></div>
            <div class="brick-platform brick-right-mario"></div>
            <div class="brick-platform brick-right-peach"></div>

            <!-- BOWSER RUNNER -->
            <div id="bowser-runner">
                <img id="bowserImg" src="bowser.gif" alt="Bowser">
            </div>

            <!-- MARIO -->
            <div id="mario-jumper-positioner">
                <div class="mario-character" id="marioCharEl"></div>
            </div>

            <!-- GAME OVER MODAL -->
            <div id="gameOverModal" class="game-over-modal hidden">
                <div class="game-over-title">Game Over! 🌋</div>
                <button class="icon-btn retry" onclick="startLavaGame()">🔄</button>
            </div>
        </div>

        <!-- VICTORY OVERLAY WITH FLASHING WORD & ICON BUTTONS -->
        <div class="victory-overlay" id="victoryOverlay">
            <div class="victory-card-box">
                <div class="flashing-victory-text" id="flashingVictoryWord">apple</div>
                <div class="icon-actions-row">
                    <button class="icon-btn retry" onclick="replayCurrentQuestion()" title="Try Again">🔄</button>
                    <button class="icon-btn next" onclick="nextLavaQuestion()" title="Next Item">➡️</button>
                </div>
            </div>
        </div>

        <!-- DECK EDITOR MODAL -->
        <div class="modal-drawer" id="editorModal">
            <div class="modal-card">
                <h3 class="modal-title" id="editorTitle">Edit Word Deck</h3>
                <textarea class="modal-textarea" id="editorInput" placeholder="Type items here..."></textarea>
                <div class="modal-buttons">
                    <button class="btn-ui btn-dark" onclick="closeDeckEditor()">Cancel</button>
                    <button class="btn-ui btn-next" onclick="saveDeckData()">Save 💾</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const defaultWords = ["apples", "bananas", "watermelons", "oranges", "hamburgers", "sandwiches", "hot dogs"];
        const defaultSentences = ["Where are you going?", "Are you going to the bakery?", "I'm going to the bookstore.", "We can get there by bus.", "It's one hundred dollars."];

        let spellingDeck = JSON.parse(localStorage.getItem('mario_lava_spelling')) || defaultWords;
        let sentenceDeck = JSON.parse(localStorage.getItem('mario_lava_sentence')) || defaultSentences;

        let currentGameMode = "spelling"; 
        let currentItemIndex = 0;
        let lavaProgress = 0;
        let lavaLives = 3;
        let lavaNodes = [];
        let lavaTimeouts = [];
        let isScatteringState = false;
        let lastSteppedStone = null;
        let editingTargetMode = "spelling";

        function playAudio(elementId, fallbackType) {
            const el = document.getElementById(elementId);
            if (el) {
                el.currentTime = 0;
                el.play().then(() => {}).catch(() => playSynthSound(fallbackType));
            } else {
                playSynthSound(fallbackType);
            }
        }

        function playSynthSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.25);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            } else if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        function clearLavaTimeouts() {
            lavaTimeouts.forEach(t => clearTimeout(t));
            lavaTimeouts = [];
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function launchGameDirect(mode) {
            currentGameMode = mode;
            currentItemIndex = 0;
            document.getElementById('main-menu-overlay').classList.add('hidden');
            startLavaGame();
        }

        function exitToMainMenu() {
            clearLavaTimeouts();
            document.getElementById('victoryOverlay').classList.remove('active');
            document.getElementById('main-menu-overlay').classList.remove('hidden');
        }

        function openDeckEditor(mode) {
            editingTargetMode = mode;
            const title = document.getElementById('editorTitle');
            const input = document.getElementById('editorInput');

            if (mode === 'spelling') {
                title.textContent = "Edit Word Deck 🔤";
                input.value = spellingDeck.join('\n');
            } else {
                title.textContent = "Edit Sentence Deck 💬";
                input.value = sentenceDeck.join('\n');
            }
            document.getElementById('editorModal').classList.add('open');
        }

        function closeDeckEditor() {
            document.getElementById('editorModal').classList.remove('open');
        }

        function saveDeckData() {
            const lines = document.getElementById('editorInput').value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length > 0) {
                if (editingTargetMode === 'spelling') {
                    spellingDeck = lines;
                    localStorage.setItem('mario_lava_spelling', JSON.stringify(spellingDeck));
                } else {
                    sentenceDeck = lines;
                    localStorage.setItem('mario_lava_sentence', JSON.stringify(sentenceDeck));
                }
                closeDeckEditor();
            } else {
                alert("Please enter at least one item!");
            }
        }

        function startLavaGame() {
            clearLavaTimeouts();
            lavaLives = 3;
            lavaProgress = 0;
            isScatteringState = true;
            lastSteppedStone = null;
            renderLavaHearts();

            document.getElementById('victoryOverlay').classList.remove('active');
            document.getElementById('gameOverModal').classList.add('hidden');

            const targetDeck = (currentGameMode === "spelling") ? spellingDeck : sentenceDeck;
            const rawItem = targetDeck[currentItemIndex] || "Mario";

            let activeUnits = [];
            if (currentGameMode === "spelling") {
                activeUnits = rawItem.replace(/\s+/g, '').toLowerCase().split('');
            } else {
                activeUnits = rawItem.trim().split(/\s+/);
            }

            const slotsBox = document.getElementById('slotsBox');
            const lavaZone = document.getElementById('lavaZone');
            const mario = document.getElementById('mario-jumper-positioner');
            const bowser = document.getElementById('bowser-runner');
            const bowserImg = document.getElementById('bowserImg');
            const castle = document.getElementById('castleElement');
            const dedicatedLava = document.getElementById('dedicatedLavaOverlay');

            bowserImg.src = 'bowser.gif?' + new Date().getTime();

            castle.classList.remove('visible');
            slotsBox.innerHTML = '';
            slotsBox.style.opacity = '0';

            dedicatedLava.classList.remove('sweeping');
            dedicatedLava.style.left = '-100%';

            lavaNodes.forEach(n => n.element.remove());
            lavaNodes = [];

            const zoneW = lavaZone.clientWidth || 700;
            const zoneH = lavaZone.clientHeight || 350;

            mario.style.transition = 'none';
            mario.style.transform = `translate3d(20px, ${zoneH - 220}px, 0)`;

            const unitSpacing = (currentGameMode === "spelling") ? 130 : 250;
            const totalWordWidth = activeUnits.length * unitSpacing;
            const startX = Math.max(220, (zoneW - totalWordWidth - 200) / 2);
            const centerY = (zoneH / 2) - 70;

            bowser.style.transition = 'none';
            bowser.style.top = `${centerY - 20}px`;
            bowser.style.transform = 'translate3d(-300px, 0, 0)';

            activeUnits.forEach((unit, i) => {
                const stone = document.createElement('div');
                stone.className = 'stone-node' + (currentGameMode === "sentence" ? ' sentence-rock' : '');
                stone.style.left = `${startX + (i * unitSpacing)}px`;
                stone.style.top = `${centerY}px`;
                stone.style.transform = 'translate3d(0,0,0)';
                
                const label = document.createElement('span');
                label.className = 'stone-label';
                label.textContent = unit;
                stone.appendChild(label);

                stone.style.opacity = '0';
                lavaZone.appendChild(stone);
                
                lavaNodes.push({ element: stone, unit: unit, baseLeft: startX + (i * unitSpacing) });
                
                setTimeout(() => { stone.style.opacity = '1'; }, i * 60);
            });

            document.getElementById('status-message').textContent = "Look at the target! 👀";

            lavaTimeouts.push(setTimeout(() => {
                document.getElementById('status-message').textContent = "Watch out for Bowser! 🐢💥";
                dedicatedLava.classList.add('sweeping');

                playAudio('sndBowser', 'wrong');

                bowser.classList.add('walking');
                const sprintDuration = 2600;
                const totalTravelDistance = zoneW + 600;

                bowser.style.transition = `transform ${sprintDuration}ms linear`;
                bowser.style.transform = `translate3d(${zoneW + 300}px, 0, 0)`;

                const positions = [];
                const minX = 200;
                const maxX = zoneW - (currentGameMode === "spelling" ? 450 : 520);
                const minY = 20;
                const maxY = zoneH - 180;
                const minDistance = (currentGameMode === "spelling") ? 140 : 240;

                lavaNodes.forEach((_, i) => {
                    let scatterX, scatterY, fitsSafely;
                    let attempts = 0;
                    do {
                        fitsSafely = true;
                        scatterX = Math.floor(Math.random() * Math.max(maxX - minX, 50)) + minX;
                        scatterY = Math.floor(Math.random() * Math.max(maxY - minY, 50)) + minY;
                        attempts++;

                        for (let j = 0; j < i; j++) {
                            const prevPos = positions[j];
                            const dist = Math.hypot(scatterX - prevPos.x, scatterY - prevPos.y);
                            if (dist < minDistance) {
                                fitsSafely = false;
                                break;
                            }
                        }
                    } while (!fitsSafely && attempts < 200);

                    positions.push({ x: scatterX, y: scatterY });
                });

                lavaNodes.forEach((nodeObj, i) => {
                    const hitTargetX = nodeObj.baseLeft - 80;
                    const positionRatio = (hitTargetX + 300) / totalTravelDistance;
                    const impactDelay = Math.max(0, sprintDuration * positionRatio);

                    lavaTimeouts.push(setTimeout(() => {
                        playAudio('sndBowser', 'wrong');
                        nodeObj.element.classList.add('smooth-move');

                        const targetPos = positions[i];
                        const tx = targetPos.x - nodeObj.baseLeft;
                        const ty = targetPos.y - centerY;

                        nodeObj.targetX = targetPos.x;
                        nodeObj.targetY = targetPos.y;

                        nodeObj.element.style.transform = `translate3d(${tx}px, ${ty}px, 0)`;
                    }, impactDelay));
                });

                lavaTimeouts.push(setTimeout(() => {
                    bowser.classList.remove('walking');
                    bowser.style.transition = 'none';
                    bowser.style.transform = 'translate3d(-300px, 0, 0)';

                    castle.classList.add('visible');

                    lavaNodes.forEach(nodeObj => {
                        nodeObj.element.classList.remove('smooth-move');
                    });

                    setupInteractiveSpellingPhase(activeUnits);

                }, sprintDuration + 100));

            }, 1200));
        }

        function setupInteractiveSpellingPhase(activeUnits) {
            document.getElementById('status-message').textContent = "Jump Mario across! 🌋";
            isScatteringState = false;

            const slotsBox = document.getElementById('slotsBox');
            slotsBox.innerHTML = '';

            activeUnits.forEach((_, i) => {
                const slot = document.createElement('div');
                slot.className = 'slot' + (currentGameMode === 'sentence' ? ' sentence-slot' : '') + (i === 0 ? ' active-target' : '');
                slot.id = `lava_slot_${i}`;
                slotsBox.appendChild(slot);
            });

            slotsBox.style.opacity = '1';

            lavaNodes.forEach(nodeObj => {
                nodeObj.element.onclick = () => {
                    handleStoneClick(nodeObj.element, nodeObj.unit, activeUnits, nodeObj.targetX, nodeObj.targetY);
                };
            });
        }

        function renderLavaHearts() {
            document.getElementById('heartsDisplay').textContent = '❤️'.repeat(lavaLives) + '💔'.repeat(3 - lavaLives);
        }

        function handleStoneClick(stoneEl, unit, activeUnits, stoneX, stoneY) {
            if (isScatteringState || lavaLives <= 0 || lavaProgress >= activeUnits.length) return;

            const targetUnit = activeUnits[lavaProgress];
            if (unit === targetUnit) {
                playAudio('sndMariowin', 'correct');

                if (lastSteppedStone) {
                    lastSteppedStone.classList.add('fade-out');
                }
                lastSteppedStone = stoneEl;

                const mario = document.getElementById('mario-jumper-positioner');
                mario.classList.add('jumping');
                mario.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
                mario.style.transform = `translate3d(${stoneX + 10}px, ${stoneY - 50}px, 0)`;

                setTimeout(() => mario.classList.remove('jumping'), 500);

                const currentSlot = document.getElementById(`lava_slot_${lavaProgress}`);
                if (currentSlot) {
                    currentSlot.textContent = unit;
                    currentSlot.classList.remove('active-target');
                }
                
                lavaProgress++;

                if (lavaProgress < activeUnits.length) {
                    const nextSlot = document.getElementById(`lava_slot_${lavaProgress}`);
                    if (nextSlot) nextSlot.classList.add('active-target');
                } else {
                    playAudio('sndArcadewin', 'correct');
                    document.getElementById('status-message').textContent = "Saved Princess Peach! 👑🎉";
                    
                    const lavaZone = document.getElementById('lavaZone');
                    const zoneW = lavaZone.clientWidth || 700;
                    const zoneH = lavaZone.clientHeight || 350;

                    lavaTimeouts.push(setTimeout(() => {
                        if (lastSteppedStone) {
                            lastSteppedStone.classList.add('fade-out');
                            lastSteppedStone = null;
                        }

                        mario.classList.add('jumping');
                        mario.style.transform = `translate3d(${zoneW - 350}px, ${zoneH - 220}px, 0)`;
                        
                        setTimeout(() => {
                            mario.classList.remove('jumping');
                            showVictoryOverlay();
                        }, 500);
                    }, 600));
                }
            } else {
                playAudio('sndMamamia', 'wrong');
                stoneEl.classList.add('wrong-shake');
                setTimeout(() => stoneEl.classList.remove('wrong-shake'), 300);

                lavaLives--;
                renderLavaHearts();

                if (lavaLives <= 0) {
                    playAudio('sndArcadelose', 'wrong');
                    document.getElementById('status-message').textContent = "Mario fell into lava! 🌋";
                    document.getElementById('gameOverModal').classList.remove('hidden');
                }
            }
        }

        function showVictoryOverlay() {
            const targetDeck = (currentGameMode === "spelling") ? spellingDeck : sentenceDeck;
            const completedItem = targetDeck[currentItemIndex];
            
            const victoryTextEl = document.getElementById('flashingVictoryWord');
            victoryTextEl.textContent = completedItem;
            
            document.getElementById('victoryOverlay').classList.add('active');
        }

        function replayCurrentQuestion() {
            document.getElementById('victoryOverlay').classList.remove('active');
            startLavaGame();
        }

        function nextLavaQuestion() {
            const targetDeck = (currentGameMode === "spelling") ? spellingDeck : sentenceDeck;
            currentItemIndex = (currentItemIndex + 1) % targetDeck.length;
            document.getElementById('victoryOverlay').classList.remove('active');
            startLavaGame();
        }
    </script>
</body>
